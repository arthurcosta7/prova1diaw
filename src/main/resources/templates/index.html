    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos TSE</title>
     <link rel="stylesheet" th:href="@{/css/style.css}"> 
    <meta name="description" content="Consulta de candidatos do TSE">
</head>
<body xmlns:th="http://www.thymeleaf.org">

    <div id="Candidatos-container">
        <div id="Candidatos-Form">
            <form method="get" th:action="@{/}" class="filtros">
                <input type="search" name="texto" placeholder="Nome, número ou nome de urna"
                       th:value="${textoSelecionado}">
                <select name="cargo">
                    <option value="" th:selected="${cargoSelecionado == ''}">Todos os cargos</option>
                    <option th:each="c : ${cargos}"
                            th:value="${c}"
                            th:text="${c}"
                            th:selected="${c == cargoSelecionado}">
                    </option>
                </select>
                <select name="partido">
                    <option value="" th:selected="${partidoSelecionado == ''}">Todos os partidos</option>
                    <option th:each="p : ${partidos}"
                            th:value="${p}"
                            th:text="${p}"
                            th:selected="${p == partidoSelecionado}">
                    </option>
                </select>
                <button type="submit">Filtrar</button>
                <a th:href="@{/}" class="limpar">Limpar</a>
            </form>

                <p th:if="${!#lists.isEmpty(candidatos)}"
                    th:text="${#lists.size(candidatos) + ' candidato(s) encontrado(s).'}"></p>
            <p th:if="${#lists.isEmpty(candidatos)}">Nenhum candidato encontrado.</p>

                <div class="grade-candidatos" th:if="${!#lists.isEmpty(candidatos)}">
                     <article class="card-candidato" th:each="cand : ${candidatos}">
                          <div th:if="${cand.fotoDisponivel}">
                                <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}"
                                      th:alt="${cand.nomeUrna}" class="foto-candidato">
                          </div>
                          <div class="foto-ausente" th:unless="${cand.fotoDisponivel}">Sem foto</div>
                          <h3 th:text="${cand.nomeUrna}"></h3>
                          <p><strong>Número:</strong> <span th:text="${cand.nrCandidato}"></span></p>
                          <p th:text="${cand.cargo}"></p>
                          <p th:text="${cand.siglaPartido + ' - ' + cand.nomePartido}"></p>
                          <p th:text="${cand.municipio}"></p>
                          <p th:if="${cand.idade >= 0}" th:text="${cand.idade + ' anos'}"></p>
                          <p th:if="${cand.ocupacao != null and !cand.ocupacao.isBlank()}"
                              th:text="${cand.ocupacao}"></p>
                          <p th:if="${cand.grauInstrucao != null and !cand.grauInstrucao.isBlank()}"
                              th:text="${cand.grauInstrucao}"></p>
                          <p class="nome-civil" th:text="${cand.nomeCandidato}"></p>
                     </article>
            </div>
        </div>
    </div>

    
</body>
</html>
